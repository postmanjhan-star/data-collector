name: Build HF811 Windows 10 x64 Installer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'server/**', 'desktop/**', 'installer/**', 'build.ps1', 'tests/**', '.github/workflows/build-windows.yml']

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build win-x64 (includes self-test)
        shell: pwsh
        run: .\build.ps1
      - name: Receiver API + Collector server-sync integration test
        shell: pwsh
        run: .\\tests\\receiver-e2e.ps1
      - name: Upload receiver integration logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: HF811Receiver-e2e-logs
          path: |
            ${{ runner.temp }}/hf811-receiver-out.txt
            ${{ runner.temp }}/hf811-receiver-err.txt
          if-no-files-found: ignore
      - name: Smoke-test current-user installation (no elevation)
        shell: pwsh
        run: .\tests\installer-smoke.ps1 -InstallMode CurrentUser
      - name: Smoke-test all-users installation (administrative)
        shell: pwsh
        run: .\tests\installer-smoke.ps1 -InstallMode AllUsers
      - name: Upload installer test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: HF811Collector-installer-smoke-log
          path: ${{ runner.temp }}/HF811Collector-install-smoke-*.log
          if-no-files-found: ignore
      - name: Upload reference API server (framework-dependent)
        uses: actions/upload-artifact@v4
        with:
          name: HF811Receiver-dotnet10
          path: dist/receiver/
          if-no-files-found: error
      - name: Upload x64 setup and SHA256 checksum
        uses: actions/upload-artifact@v4
        with:
          name: HF811Collector-win-x64-Setup
          path: |
            dist/installer/HF811Collector-win-x64-Setup.exe
            dist/installer/SHA256SUMS.txt
          if-no-files-found: error
