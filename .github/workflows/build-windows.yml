name: Build HF811 Windows 10 x64 Installer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'installer/**', 'build.ps1', '.github/workflows/build-windows.yml']

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build win-x64 (includes self-test)
        shell: pwsh
        run: .\build.ps1
      - name: Upload x64 setup and SHA256 checksum
        uses: actions/upload-artifact@v4
        with:
          name: HF811Collector-win-x64-Setup
          path: |
            dist/installer/HF811Collector-win-x64-Setup.exe
            dist/installer/SHA256SUMS.txt
          if-no-files-found: error
